name: Release Extension

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build core
        run: npm run build --workspace=packages/core

      - name: Package VSIX
        run: npm run package --workspace=packages/vscode

      - name: Prepare assets
        id: vsix
        run: |
          VSIX=$(ls packages/vscode/*.vsix)
          cp "$VSIX" packages/vscode/llmwiki-latest.vsix
          echo "versioned=$VSIX" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: llmwiki-vsix
          path: packages/vscode/*.vsix
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "${{ steps.vsix.outputs.versioned }}" \
            packages/vscode/llmwiki-latest.vsix \
            --title "${{ github.ref_name }}" --generate-notes \
          || gh release upload "${{ github.ref_name }}" \
            "${{ steps.vsix.outputs.versioned }}" \
            packages/vscode/llmwiki-latest.vsix --clobber
